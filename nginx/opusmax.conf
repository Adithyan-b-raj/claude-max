# OpusMax Proxy — nginx configuration
# Place at: /etc/nginx/sites-available/opusmax.conf
# Symlink to sites-enabled and reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name opusmax.pro www.opusmax.pro;

    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name opusmax.pro www.opusmax.pro;

    # TLS (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/opusmax.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/opusmax.pro/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/opusmax.pro/chain.pem;

    # TLS security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size (10MB, same as upstream Anthropic limit)
    client_max_body_size 10m;
    client_body_timeout 30s;

    # Proxy to Node.js backend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Streaming support — do NOT buffer SSE responses
        proxy_buffering off;
        proxy_cache off;

        # Disable compression for SSE (avoids buffering issues)
        proxy_set_header Accept-Encoding "";

        # WebSocket upgrade (not needed now, but useful if adding WS later)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
